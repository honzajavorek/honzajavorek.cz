[project]
name = "blog"
version = "0.0.0"
description = "Honza Javorek's personal website and blog"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Honza Javorek", email = "mail@honzajavorek.cz" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pelican[markdown]>=4.9.1",
    "lxml>=6.1.3,<6.2.0",
    "cssselect>=1.5.0",
    "pillow>=12.3.0",
    "markdown-del-ins>=1.0.0",
    "python-slugify>=9.1.0",
    "telethon>=1.45.0",
    "beautifulsoup4>=4.12.3",
    "click>=8.5.0",
    "sqlite-utils>=3.37",
    "send2trash>=2.1.0",
    "pillow-heif>=1.7.0",
    "icalendar>=7.3.0",
    "extruct>=0.18.0",
    "notion-client==2.2.1",
    "feedgen>=1.0.0",
    "mastodon-py>=1.8.1",
    "stamina>=26.1.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "githubkit>=0.16.1",
]

[project.urls]
Homepage = "https://honzajavorek.cz/"
Repository = "https://github.com/honzajavorek/honzajavorek.cz/"

[project.scripts]
blog = "blog:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-ruff>=0.5",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = "tests"
norecursedirs = "node_modules"
addopts = "--ff --ruff --ruff-format"
filterwarnings = [
    "ignore:invalid escape sequence:DeprecationWarning",  # extruct
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[build-system]
requires = ["uv-build>=0.5.0,<0.12"]
build-backend = "uv_build"
